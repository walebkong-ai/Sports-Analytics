<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Market Comparison</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><header class="topbar"><div><p class="eyebrow" id="marketStatus">Loading markets</p><h1>NFL Market Comparison</h1></div><a href="index.html">Game Predictor</a></header>
<p id="connectionStatus" role="status"></p>
<section aria-label="Public-results baseline" style="border-top:1px solid #ccd3d8;padding:20px 0">
<h2>Results-based forecast</h2><label class="field"><span>Upcoming game</span><select id="baselineGame"></select></label><div id="baselinePrediction"></div>
</section>
<section class="topbar-actions" aria-label="Scanner filters">
<label class="field"><span>Team</span><select id="teamFilter"><option value="">All teams</option></select></label>
<label class="field"><span>Sportsbook</span><select id="bookFilter"><option value="">All books</option></select></label>
<label class="field"><span>Minimum gap (pts)</span><input id="gapFilter" type="number" min="0" max="100" value="0"></label>
<label class="field"><span>Confidence</span><select id="confidenceFilter"><option value="">All</option><option>Moderate</option><option>Strong signal</option><option>Slight edge</option><option>Toss-up</option></select></label>
</section><p>Moneyline · Probabilities conditional on a decisive result</p><p id="marketError" role="alert"></p><section id="scanner" aria-live="polite"></section></main><script src="market.js"></script></body></html>
